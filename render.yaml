services:
  - type: web
    name: guess-the-chart
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: TOKEN_MINT
        value: 5671ysSG8RL8dU5pMy9KVG95GrGGFyfaLbvaVWF6pump
      - key: DB_SCHEMA
        value: gtc
